:root{

}
@media (prefers-color-scheme: dark){

  }
}
:root[data-theme="dark"]{
  --bg:#141C22; --ink:#E9EEF0; --muted:#9FB0B6; --line:#2F3E46; --panel:#1A242B; --accent:#A996FF; --accent-ink:#17122E; --chip:#24313A;

}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent);font-weight:500;text-underline-offset:3px}

#scene{position:fixed;inset:0}

.intro{position:fixed;top:0;left:0;z-index:6;padding:calc(env(safe-area-inset-top,0px) + 22px) 26px 0;max-width:30rem;pointer-events:none;transition:opacity .35s}
.intro h1{font-weight:800;font-size:clamp(1.9rem,4.4vw,3.2rem);line-height:1;letter-spacing:-0.035em;margin:0 0 .35em}
.intro p{margin:0;color:var(--muted)}
body.panel-open .intro{opacity:0}

#labels{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.hot{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:7px;
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.32em .8em .32em .45em;
  font-size:.82rem;font-weight:600;white-space:nowrap;box-shadow:0 6px 18px -8px rgba(0,0,0,.35);transition:opacity .3s}
.hot .ping{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hot:hover,.hot.lit{border-color:var(--accent)}
body.panel-open .hot{opacity:0;pointer-events:none}

.menu{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:8;
  display:flex;gap:4px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:999px;
  box-shadow:0 10px 30px -12px rgba(0,0,0,.4);max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
.menu button{border:0;background:transparent;border-radius:999px;padding:.5em .95em;font-size:.86rem;font-weight:500;white-space:nowrap}
.menu button:hover{background:var(--chip)}
.menu button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}

#panel{position:fixed;top:0;right:0;bottom:0;z-index:10;width:min(440px,100%);
  padding:calc(env(safe-area-inset-top,0px) + 70px) 30px calc(env(safe-area-inset-bottom,0px) + 90px);
  background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;
  transform:translateX(102%);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
body.panel-open #panel{transform:none}
.close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:20px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:.35em .95em;font-size:.86rem}
.close:hover{border-color:var(--ink)}
#panel .where{color:var(--accent);font-weight:600;font-size:.88rem;margin:0 0 .6em}
#panel h2{font-weight:800;font-size:2rem;line-height:1.05;letter-spacing:-0.03em;margin:0 0 .35em}
#panel h2:focus{outline:none}
#panel .lede{color:var(--muted);margin:0 0 1.4em}
.role{padding:1em 0;border-top:1px solid var(--line)}
.role h3{font-size:1.02rem;margin:0}
.role .when{color:var(--muted);font-size:.86rem;margin:.1em 0 .5em}
.role ul{margin:0;padding-left:1.1em}
.role li{margin:0 0 .4em}
.chips{list-style:none;padding:0;margin:.3em 0 0;display:flex;flex-wrap:wrap;gap:6px}
.chips li{background:var(--chip);border-radius:8px;padding:.2em .65em;font-size:.86rem}
.links{display:flex;flex-direction:column;margin-top:.4em}
.links a{padding:.7em 0;border-top:1px solid var(--line);text-decoration:none;display:flex;justify-content:space-between;gap:12px}
.links a span{color:var(--muted);font-weight:400}

#fallback{display:none}
body.no-gl{overflow:auto}
body.no-gl #scene,body.no-gl #labels,body.no-gl .menu,body.no-gl #panel{display:none}
body.no-gl .intro{position:static}
body.no-gl #fallback{display:block;max-width:40rem;padding:0 26px 40px}
#fallback section{padding:1.4em 0;border-top:1px solid var(--line)}

@media (max-width:700px){
  .intro{padding-left:18px;padding-right:18px}
  .intro h1{font-size:1.8rem}
  #panel{top:auto;left:0;width:100%;height:62%;border-left:0;border-top:1px solid var(--line);border-radius:22px 22px 0 0;
    padding:54px 20px calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateY(102%)}
  .close{top:12px;right:16px}
  #panel h2{font-size:1.6rem}
}
@media (prefers-reduced-motion: reduce){ #panel{transition:none} .hot .ping{animation:none} }
</style>
